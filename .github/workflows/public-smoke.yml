name: Anonymous public network smoke

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-parse:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify and install hash-locked runtime dependencies
        shell: powershell
        run: |
          python tools/verify_dependency_lock.py
          if ($LASTEXITCODE -ne 0) { throw "dependency lock verification failed with exit code $LASTEXITCODE" }
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "dependency installation failed with exit code $LASTEXITCODE" }

      - name: Run one-shot anonymous public parse
        shell: powershell
        timeout-minutes: 3
        run: |
          $output = Join-Path $env:RUNNER_TEMP "public-parse-smoke.json"
          python tools/public_parse_smoke.py --output $output
          $smokeExit = $LASTEXITCODE
          if (Test-Path -LiteralPath $output) { Get-Content -LiteralPath $output -Encoding utf8 }
          if ($smokeExit -ne 0) { throw "public parse smoke failed with exit code $smokeExit" }

      - name: Generate and poll one anonymous QR challenge
        if: always()
        shell: powershell
        timeout-minutes: 2
        run: |
          $output = Join-Path $env:RUNNER_TEMP "public-qr-smoke.json"
          python tools/public_qr_smoke.py --output $output
          $smokeExit = $LASTEXITCODE
          if (Test-Path -LiteralPath $output) { Get-Content -LiteralPath $output -Encoding utf8 }
          if ($smokeExit -ne 0) { throw "public QR smoke failed with exit code $smokeExit" }

      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anonymous-public-parse-${{ github.run_id }}
          path: ${{ runner.temp }}/public-parse-smoke.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload QR smoke result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anonymous-public-qr-${{ github.run_id }}
          path: ${{ runner.temp }}/public-qr-smoke.json
          if-no-files-found: error
          retention-days: 14
