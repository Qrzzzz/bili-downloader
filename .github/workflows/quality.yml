name: Quality checks

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-sbom.txt

      - name: Prepare isolated application directories
        shell: powershell
        run: |
          $appRoot = Join-Path $env:RUNNER_TEMP "BiliDownloader"
          $appData = Join-Path $appRoot "AppData\Roaming"
          $localAppData = Join-Path $appRoot "AppData\Local"
          New-Item -ItemType Directory -Force -Path $appData, $localAppData | Out-Null
          @(
            "APPDATA=$appData"
            "LOCALAPPDATA=$localAppData"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install hash-locked test dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "dependency installation failed with exit code $LASTEXITCODE" }

      - name: Run unit and integration tests
        shell: powershell
        timeout-minutes: 10
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "pytest failed with exit code $LASTEXITCODE" }

      - name: Check installed dependency consistency
        shell: powershell
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "pip check failed with exit code $LASTEXITCODE" }
