name: Quality checks

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-sbom.txt

      - name: Prepare isolated application directories
        shell: powershell
        run: |
          $appRoot = Join-Path $env:RUNNER_TEMP "BiliDownloader"
          $appData = Join-Path $appRoot "AppData\Roaming"
          $localAppData = Join-Path $appRoot "AppData\Local"
          New-Item -ItemType Directory -Force -Path $appData, $localAppData | Out-Null
          @(
            "APPDATA=$appData"
            "LOCALAPPDATA=$localAppData"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install hash-locked test dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "dependency installation failed with exit code $LASTEXITCODE" }

      - name: Run unit and integration tests
        shell: powershell
        timeout-minutes: 10
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "pytest failed with exit code $LASTEXITCODE" }

      - name: Check installed dependency consistency
        shell: powershell
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "pip check failed with exit code $LASTEXITCODE" }

      - name: Build real WinUI frontend with locked NuGet dependencies
        shell: powershell
        run: |
          dotnet restore BiliDownloader.WinUI/BiliDownloader.WinUI.csproj --locked-mode -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }
          dotnet build BiliDownloader.WinUI/BiliDownloader.WinUI.csproj --no-restore -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "WinUI build failed" }

      - name: Test C# transport against real Python pipes
        shell: powershell
        run: |
          $env:BILI_TEST_PYTHON = (Get-Command python).Source
          $env:BILI_BACKEND_SOURCE = (Get-Location).Path
          dotnet restore BiliDownloader.WinUI.Tests --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "C# test restore failed" }
          dotnet run --project BiliDownloader.WinUI.Tests -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "C# transport tests failed" }
