name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-sbom.txt

      - name: Prepare isolated application directories
        shell: powershell
        run: |
          $appRoot = Join-Path $env:RUNNER_TEMP "BiliDownloader"
          $appData = Join-Path $appRoot "AppData\Roaming"
          $localAppData = Join-Path $appRoot "AppData\Local"
          New-Item -ItemType Directory -Force -Path $appData, $localAppData | Out-Null
          @(
            "APPDATA=$appData"
            "LOCALAPPDATA=$localAppData"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify dependency locks
        shell: powershell
        run: python tools/verify_dependency_lock.py

      - name: Install hash-locked test dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "dependency installation failed with exit code $LASTEXITCODE" }

      - name: Run unit and integration tests
        shell: powershell
        timeout-minutes: 10
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "pytest failed with exit code $LASTEXITCODE" }

      - name: Compile and import Python sources
        shell: powershell
        run: |
          python -m compileall -q app tests tools
          if ($LASTEXITCODE -ne 0) { throw "compileall failed with exit code $LASTEXITCODE" }
          python -c "import app.auth_qr, app.config, app.cookies, app.crash, app.diagnostics, app.downloader, app.logger, app.main, app.ui_dialogs, app.ui_main, app.utils"
          if ($LASTEXITCODE -ne 0) { throw "application import smoke failed with exit code $LASTEXITCODE" }

      - name: Check installed dependency consistency
        shell: powershell
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "pip check failed with exit code $LASTEXITCODE" }

      - name: Run source self-test
        shell: powershell
        timeout-minutes: 2
        run: |
          python -m app.main --self-test
          if ($LASTEXITCODE -ne 0) { throw "source self-test failed with exit code $LASTEXITCODE" }

      - name: Build onefile package from a clean environment
        shell: powershell
        timeout-minutes: 20
        run: .\build.ps1 -Clean -OneFile

      - name: Smoke and audit onefile package
        shell: powershell
        timeout-minutes: 4
        run: |
          $artifact = ".\dist\BiliDownloader.v1.4.exe"
          .\tools\package_smoke.ps1 -Executable $artifact
          .\build\.venv\Scripts\python.exe tools\audit_release_artifact.py --executable $artifact --expected-version 1.4 --expected-commit $env:GITHUB_SHA --require-clean
          if ($LASTEXITCODE -ne 0) { throw "artifact audit failed with exit code $LASTEXITCODE" }
